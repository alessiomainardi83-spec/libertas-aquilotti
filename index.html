<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libertas Aquilotti Big 2016</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f7f3f4; --surface:#fff; --line:#eadfe2; --ink:#2a1218; --muted:#6e5a60;
  --brand:#7a1f35; --brand-dark:#5c1426; --brand-ink:#fff; --ball:#7a1f35; --ball-soft:#f6e3e8;
  --win:#1f7a4d; --loss:#b4372f; --chip:#f1e8ea; --libc:#7a1f35;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif; --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#150c0f; --surface:#21141a; --line:#3a2730; --ink:#f4ecee; --muted:#b9a3aa;
  --brand:#7a1f35; --brand-dark:#4e1020; --ball:#e58aa0; --ball-soft:#3d1c26; --win:#5cc78f; --loss:#ef7d73; --chip:#2e1c23; --libc:#f2a7b9; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px)}
header.top{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-dark) 100%);border-bottom:4px solid #fff}
header.top .wrap{padding-block:16px 14px;display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;flex:none;border-radius:50%;background:#fff;object-fit:contain;padding:3px;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
h1{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.08em}
.sub{font-size:14px;opacity:.9;margin-top:4px;letter-spacing:.02em}
.hero{border-radius:var(--r);background:linear-gradient(160deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;padding:22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:14px solid rgba(255,255,255,.08)}
.hero .logo{width:104px;height:104px;padding:6px;position:relative;z-index:1}
.hero .w{font-family:var(--f-display);font-weight:700;font-size:52px;letter-spacing:.14em;line-height:1;text-transform:uppercase}
.hero .s{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.hero .w2{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.3em;line-height:1;text-transform:uppercase;margin-right:-.3em}
.hero .stripe{width:64px;height:4px;background:#fff;border-radius:2px;margin:4px 0}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--brand);border-top:1px solid rgba(255,255,255,.15)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:var(--brand-ink);opacity:.75;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:10px 10px 9px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs{background:var(--brand-dark)}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:#fff}
main .wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--muted)}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.06em;margin:4px 0 0;color:var(--muted)}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.note{color:var(--muted);font-size:14px;margin:0}
.empty{padding:18px;color:var(--muted);font-size:15px}
.next{padding:16px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--ball)}
.next .when{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;text-transform:uppercase}
.next .vs{font-size:19px;font-weight:600}
.next .where{color:var(--muted);font-size:15px}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.badge.hot{background:var(--brand);color:#fff}
.badge.soft{background:var(--ball-soft)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{font-family:var(--f-display);text-align:center;line-height:1}
.date b{display:block;font-size:26px;font-weight:700}
.date span{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.teams{min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600;overflow-wrap:anywhere}
.t.lib{color:var(--libc)}
.meta{font-size:13px;color:var(--muted)}
.score{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;text-align:right;line-height:1;white-space:nowrap}
.score small{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;margin-top:4px;text-transform:uppercase}
.score.w small{color:var(--win)} .score.l small{color:var(--loss)}
.score.todo{font-size:18px;color:var(--muted)}
.score.wait{font-size:13px;font-family:var(--f-body);font-weight:600;color:var(--muted);max-width:90px;white-space:normal}
.month{font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 14px 4px;border-top:1px solid var(--line)}
.month:first-child{border-top:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{padding:12px 6px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:9px 10px;text-align:right;border-top:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.lib td{font-weight:700;background:var(--ball-soft)}
.tor{padding:14px;display:flex;flex-direction:column;gap:6px}
.tor b{font-size:18px}
.tor .res{font-weight:600}
.tor .line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
footer{color:var(--muted);font-size:13px}
footer a{color:inherit}
</style>
</head>

  if(next[0]){const p=next[0];h+=`<section><h2>Prossima partita</h2><div class="card next"><div>${p.data===t?'<span class="badge hot">oggi</span> ':""}<span class="badge soft">${esc(p.gio)}</span></div><div class="when">${esc(lungo(p.data))} · ${esc(p.ora)}</div><div class="vs">${esc(SQ[p.casa])} – ${esc(SQ[p.osp])}</div><div class="where">${esc(PAL[p.pal])}${p.casa==="LIB"?" · in casa":" · in trasferta"}</div></div></section>`}
  h+=`<section><h2>La stagione</h2><div class="stats"><div class="card stat"><b>${g.length}</b><span>Giocate</span></div><div class="card stat"><b>${v}</b><span>Vinte</span></div><div class="card stat"><b>${g.length-v}</b><span>Perse</span></div><div class="card stat"><b>${pos}°</b><span>In classifica</span></div></div></section>`;
  const after=next.slice(1,4);
  if(after.length)h+=`<section><h2>Poi</h2><div class="card list">${after.map(row).join("")}</div></section>`;
  h+=`<section><h2>Ultimi risultati</h2><div class="card list">${last.length?last.map(row).join(""):'<div class="empty">Ancora nessun risultato.</div>'}</div></section>`;

function filters(){const b=(v,l)=>`<button data-f="${v}" aria-pressed="${filtro===v}">${l}</button>`;return `<div class="filters">${b("lib","Partite Libertas")}${b("all","Tutto il girone")}</div>`}
function vCal(){const t=today();let l=P.filter(p=>!giocata(p)&&p.data>=t);if(filtro==="lib")l=l.filter(isLib);
  return `<section><h2>Calendario</h2>${filters()}<div class="card list">${l.length?grouped(l):'<div class="empty">Nessuna partita da giocare.</div>'}</div><p class="note">Prima fase fino a metà febbraio. Il calendario della seconda fase esce di solito a fine febbraio. Orari e palestre possono cambiare: in caso di dubbio vale il comunicato FIP.</p></section>`}
function vRis(){const t=today();let l=P.filter(p=>giocata(p)||p.data<t);if(filtro==="lib")l=l.filter(isLib);l=l.slice().reverse();
  return `<section><h2>Risultati</h2>${filters()}<div class="card list">${l.length?grouped(l):'<div class="empty">Ancora nessun risultato.</div>'}</div><p class="note">Nel minibasket il punteggio è per tempini vinti, non per canestri. Risultati dai comunicati FIP Toscana.</p></section>`}
function vClass(){const cl=classifica();const n=P.filter(giocata).length;
  return `<section><h2>Classifica</h2><div class="card"><div class="tablewrap"><table><thead><tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th>V</th><th>P</th></tr></thead><tbody>${cl.map((x,i)=>`<tr class="${x.k==="LIB"?"lib":""}"><td>${i+1}</td><td>${esc(SQ[x.k])}</td><td>${x.pt}</td><td>${x.g}</td><td>${x.v}</td><td>${x.p}</td></tr>`).join("")}</tbody></table></div></div>
  <p class="note">${esc(CAMPIONATO)}. 2 punti a vittoria, calcolata sulle ${n} partite con risultato ufficiale. <a href="${FIP_URL}" target="_blank" rel="noopener">Classifica sul sito FIP</a></p></section>`}

function torCard(t){return `<div class="card tor"><div class="line"><span class="badge ${t.risultato?"":"soft"}">${esc(t.periodo)}</span></div><b>${esc(t.nome)}</b><span class="note">${esc(t.luogo)}</span>${t.formula?`<span class="note">${esc(t.formula)}</span>`:""}${t.risultato?`<span class="line">${t.top?'<span class="badge hot">🏆</span>':""}<span class="res">${esc(t.risultato)}</span></span>`:""}${t.dettaglio?`<span class="note">${esc(t.dettaglio)}</span>`:""}${t.info?`<span class="note">${esc(t.info)}</span>`:""}</div>`}
function vTornei(){return `<section><h2>In programma · 2026/27</h2>${TORNEI_PROGRAMMA.map(torCard).join("")}</section>
  <section><h2>Stagione 2025/26</h2>${TORNEI_STORICO.map(torCard).join("")}<p class="note">Per questi tornei non ci sono ancora le date dell'edizione 2026/27. Appena escono li sposto in “In programma”.</p></section>`}

function route(){const v=(location.hash||"#home").slice(1);return ["home","calendario","risultati","classifica","tornei"].includes(v)?v:"home"}
function render(){const v=route();document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));
  const at=document.querySelector(`nav.tabs a[data-v="${v}"]`);if(at){const w=at.parentElement;w.scrollLeft=Math.max(0,at.offsetLeft-(w.clientWidth-at.offsetWidth)/2)}
  $("#view").innerHTML=({home:vHome,calendario:vCal,risultati:vRis,classifica:vClass,tornei:vTornei})[v]()+
  `<footer>Dati aggiornati al ${esc(lungo(AGGIORNATO))} · fonte: FIP Toscana e organizzatori dei tornei. App curata dai genitori, non ufficiale della società.</footer>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){filtro=b.dataset.f;render()}});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
